<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10151e">
<title>Cat Ninja</title>
<style>
:root{color-scheme:dark;--ink:#f7f5ec;--panel:#19232c;--cyan:#68e0db;--coral:#ff796a;--gold:#ffcf66}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#10151e;touch-action:none;font-family:system-ui,sans-serif}
body{position:fixed;inset:0}
#game{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:var(--ink);border:1px solid #ffffff36;background:#19232dcc;border-radius:12px;cursor:pointer;touch-action:none;box-shadow:0 5px 16px #0003}
button:active{transform:translateY(1px)}
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:flex-start}
.group{display:flex;gap:8px;align-items:center;pointer-events:auto}
.iconBtn{width:46px;height:46px;display:grid;place-items:center;font-size:21px;background:#17212bd9}
#levelBadge{min-width:76px;height:42px;padding:0 12px;display:grid;place-items:center;background:#17212bd9;border:1px solid #ffffff24;border-radius:11px;font-size:12px;font-weight:800;letter-spacing:1px;white-space:nowrap}
#levelProgress{position:absolute;left:50%;top:calc(62px + env(safe-area-inset-top));transform:translateX(-50%);width:min(72vw,420px);height:7px;border-radius:99px;background:#ffffff24;overflow:hidden;pointer-events:none}
#levelProgressFill{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--gold));box-shadow:0 0 10px #68e0db77;transition:width .12s linear}
#coinBadge{height:42px;display:flex;align-items:center;gap:7px;padding:0 12px;background:#17212bd9;border:1px solid #ffffff24;border-radius:11px;font-weight:800}
.coinDot{width:15px;height:15px;border-radius:50%;background:var(--gold);border:3px solid #fff0a0;box-shadow:0 0 12px #ffd56088}
#skipBtn{display:none;pointer-events:auto;position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);background:#3857d6;border:1px solid #aebeff;font-weight:800;padding:14px 18px;font-size:15px;letter-spacing:.3px;white-space:nowrap}
#skipBtn{position:static;transform:none;width:100%;margin-top:8px}
#skipBtn:active{transform:translateY(1px)}
#menuOverlay{display:none;position:fixed;inset:0;z-index:6;overflow:hidden;background:#332139}
#menuOverlay.open{display:flex}
#menuSceneCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#menuOverlay:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#211b2ef0 0%,#211b2ebd 36%,#211b2e12 72%),linear-gradient(0deg,#211b2e70,transparent 45%);pointer-events:none}
.menuSceneContent{position:relative;z-index:1;width:min(1180px,100%);height:100%;margin:auto;padding:36px 44px;display:grid;grid-template-columns:minmax(300px,.72fr) 1.28fr;align-items:center}
.menuIntro{width:min(410px,100%)}
.menuKicker{color:#ffd39f;font-size:11px;font-weight:850;letter-spacing:2px}
.menuIntro h1{margin:14px 0 20px;color:#fff0d5;font-size:74px;font-weight:950;line-height:.88}
.menuIntro h1 span{color:#ffae7e}
.menuStats{display:flex;align-items:center;gap:10px;color:#fff0d5;font-size:13px;font-weight:850}
.menuStats span{min-height:36px;display:flex;align-items:center;gap:7px;padding:0 12px;border:1px solid #fff4d244;border-radius:20px;background:#341f3380}
.menuSceneActions{display:grid;gap:10px;width:min(330px,100%);margin-top:24px}
#menuOverlay .menuAction{min-height:54px;background:#36283bce;border-color:#fff0d533}
#menuOverlay .menuAction:hover{background:#4b3344;border-color:#ffe2b888}
#menuOverlay .menuAction.primary{background:#b24e4b;border-color:#ffd39f9c}
#menuOverlay .menuAction.primary:hover{background:#c85e51}
#menuOverlay .menuAction.danger{background:#342a3ccc;border-color:#fff0d533}
#deathOverlay{display:none;position:fixed;inset:0;z-index:7;align-items:center;justify-content:center;padding:18px;background:#060a10c7;backdrop-filter:blur(7px);animation:veilIn .2s ease-out both}
#deathOverlay.open{display:flex}
.menuPanel{position:relative;width:min(380px,100%);padding:26px 24px 22px;text-align:center;background:linear-gradient(155deg,#22313b,#121b25 72%);border:1px solid #ffffff35;border-radius:20px;box-shadow:0 28px 90px #000b;animation:panelIn .34s cubic-bezier(.2,.8,.2,1) both}
.menuPanel:before{content:"";position:absolute;inset:0 18% auto;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.85}
.menuEyebrow{margin:0 0 6px;color:#8da7ad;font-size:10px;font-weight:850;letter-spacing:2px}
.menuPanel h2{margin:0 0 20px;font-size:27px;font-weight:950;letter-spacing:1px;color:var(--ink)}
.deathMark{width:64px;height:64px;margin:0 auto 13px;display:grid;place-items:center;border:2px solid #ff796a88;border-radius:50%;color:#ff8a78;font-size:34px;font-weight:850;box-shadow:0 0 32px #ff796a22;animation:markPop .48s cubic-bezier(.17,.89,.32,1.35) both}
.menuActions{display:grid;gap:9px}
.menuAction{width:100%;min-height:48px;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;background:#273741;border:1px solid #ffffff26;border-radius:11px;font-size:14px;font-weight:850;letter-spacing:.3px;transition:background .16s,border-color .16s,transform .16s}
.menuAction:hover{background:#324852;border-color:#ffffff55;transform:translateY(-1px)}
.menuAction.primary{background:#1b5053;border-color:#68e0db99}
.menuAction.primary:hover{background:#246368}
.menuAction.danger{background:#442b32;border-color:#ff796a66}
#deathOverlay .menuPanel{border-color:#ff796a55}
#deathOverlay .menuPanel:before{background:linear-gradient(90deg,transparent,#ff796a,transparent)}
#levelCompleteOverlay{display:none;position:fixed;inset:0;z-index:7;align-items:center;justify-content:center;padding:18px;background:#060a10c7;backdrop-filter:blur(7px);animation:veilIn .2s ease-out both}
#levelCompleteOverlay.open{display:flex}
#levelCompleteOverlay .menuPanel{border-color:#68e0db66}
#levelCompleteOverlay .menuPanel:before{background:linear-gradient(90deg,transparent,#68e0db,transparent)}
#levelCompleteOverlay .deathMark{border-color:#68e0db99;color:#8ffff0;font-size:30px;box-shadow:0 0 32px #68e0db30}
#settingsOverlay{display:none;position:fixed;inset:0;z-index:9;align-items:center;justify-content:center;padding:18px;background:#060a10d4;backdrop-filter:blur(8px);animation:veilIn .2s ease-out both}
#settingsOverlay.open{display:flex}
.settingsPanel{width:min(520px,100%);max-height:min(760px,92dvh);overflow:auto;padding:22px;background:linear-gradient(150deg,#24353e,#131d27 75%);border:1px solid #ffffff36;border-radius:18px;box-shadow:0 28px 90px #000b;animation:panelIn .3s cubic-bezier(.2,.8,.2,1) both}
.settingsHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.settingsHead h2{margin:0;font-size:23px;font-weight:900;letter-spacing:1px}
.settingsGrid{display:grid;gap:10px;margin-bottom:16px}
.settingRow{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:12px;min-height:48px;padding:10px 12px;background:#ffffff08;border:1px solid #ffffff17;border-radius:10px}
.settingName{color:#dbe8e5;font-size:11px;font-weight:850;letter-spacing:1px}
.settingControl{display:flex;align-items:center;gap:10px;min-width:0}
.settingControl output{min-width:38px;text-align:right;color:#f5d894;font-size:12px;font-weight:800}
.settingControl input[type=range]{width:100%;min-width:60px;accent-color:var(--cyan);touch-action:auto}
.settingToggle{min-width:86px;padding:9px 10px;background:#273741;border-color:#ffffff30;font-size:11px;font-weight:850}
.settingToggle[aria-pressed="true"]{background:#1b5053;border-color:#68e0db99}
.settingModes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;width:100%;padding:4px;background:#101921;border-radius:9px}
.settingModes button{min-width:0;padding:9px 5px;background:transparent;border-color:transparent;box-shadow:none;font-size:11px;font-weight:800}
.settingModes button.selected{background:#30434a;border-color:#68e0db70;color:#c5fff1}
.settingsFooter{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#overlay{display:none;position:fixed;inset:0;z-index:8;align-items:center;justify-content:center;background:#060a10b8;padding:18px}
#overlay.open{display:flex}
.shop{width:min(680px,100%);max-height:min(680px,92dvh);overflow:auto;background:#18222c;border:1px solid #ffffff30;border-radius:18px;padding:18px;box-shadow:0 24px 80px #0009}
.shopHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.shopHead h2{font-size:18px;margin:0;font-weight:850;letter-spacing:.5px}
#skinGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.skinCard{min-width:0;min-height:145px;border-radius:13px;background:#202e38;border:1px solid #ffffff20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 6px;font-size:12px;font-weight:750}
.skinCard.selected{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.skinCard canvas{width:68px;height:68px}
.skinCard span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#shopCoins{font-size:12px;color:#ffdb83;font-weight:800}
#touchControls{display:none;position:fixed;inset:auto 0 calc(16px + env(safe-area-inset-bottom));z-index:3;justify-content:space-between;align-items:flex-end;padding:0 18px;pointer-events:none}
#touchControls.jump-left .touchCluster:first-child{order:2}
#touchControls.jump-left .touchCluster:last-child{order:1}
.touchCluster{display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
.touchBtn{width:clamp(64px,15vw,86px);height:clamp(64px,15vw,86px);border-radius:50%;background:#dcebf02a;border:2px solid #ffffff59;color:#fff;font-size:29px;font-weight:800;backdrop-filter:blur(4px);box-shadow:0 4px 18px #0004;transition:background .12s,transform .12s,border-color .12s}
.touchBtn.isHeld{background:#ffffff55;border-color:#fff;transform:scale(.94)}
.touchBtn.jump{width:clamp(78px,18vw,104px);height:clamp(78px,18vw,104px);background:#68e0db48;border-color:#8ffff0a3;font-size:15px;letter-spacing:.5px}
.touchBtn.jump.isHeld{background:#68e0db9c;border-color:#c0fff3}
@media (pointer:coarse),(max-width:760px){#touchControls{display:flex}.iconBtn{width:42px;height:42px}.shop{padding:14px}.skinCard{min-height:130px}}
@media (max-width:760px){.menuSceneContent{grid-template-columns:1fr;align-content:center;padding:24px;gap:0}.menuIntro{width:min(420px,100%)}.menuIntro h1{font-size:54px;margin:10px 0 15px}.menuSceneActions{width:min(360px,100%);margin-top:18px}}
@media (max-width:380px){#skinGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.group{gap:4px}.iconBtn{width:36px;height:36px;font-size:18px}.settingsPanel{padding:16px}.settingRow{grid-template-columns:88px minmax(0,1fr);gap:8px;padding:8px}.menuSceneContent{padding:20px}.menuIntro h1{font-size:48px}.menuSceneActions{gap:8px}.menuStats span{font-size:12px;padding:0 10px}}
@keyframes veilIn{from{opacity:0}to{opacity:1}}
@keyframes panelIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes markPop{from{transform:scale(.45) rotate(-18deg)}to{transform:scale(1) rotate(0)}}
</style>
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js" async></script>
</head>
<body>
<canvas id="game" aria-label="Platform game"></canvas>
<div id="hud">
  <div class="group"><div id="levelBadge">01</div><div id="coinBadge"><i class="coinDot"></i><span id="coinCount">0</span></div></div>
  <div id="levelProgress" aria-label="Level progress"><div id="levelProgressFill"></div></div>
  <div class="group"><button class="iconBtn" id="skinsBtn" aria-label="Skins" title="Skins">✦</button><button class="iconBtn" id="soundBtn" aria-label="Mute" title="Mute">♫</button><button class="iconBtn" id="settingsBtn" aria-label="Settings" title="Settings">⚙</button><button class="iconBtn" id="pauseBtn" aria-label="Pause" title="Pause">Ⅱ</button></div>
</div>
<div id="menuOverlay" aria-hidden="true"><canvas id="menuSceneCanvas" aria-hidden="true"></canvas><section class="menuSceneContent"><div class="menuIntro"><div class="menuKicker">NINJA HIDEOUT</div><h1>CAT<br><span>NINJA</span></h1><div class="menuStats"><span id="menuLevel">23 / 50</span><span id="menuCoins">● 14</span></div><nav class="menuSceneActions"><button class="menuAction primary" id="continueBtn">▶　CONTINUE</button><button class="menuAction" id="menuSkinsBtn">✦　SKIN SHOP</button><button class="menuAction" id="menuSettingsBtn">⚙　SETTINGS</button><button class="menuAction danger" id="restartBtn">↻　RESTART LEVEL</button></nav></div></section></div>
<div id="deathOverlay" aria-hidden="true"><section class="menuPanel"><div class="deathMark">×</div><p class="menuEyebrow">RUN OVER</p><h2>YOU GOT CAUGHT!</h2><div class="menuActions"><button class="menuAction primary" id="respawnBtn">↻　RESPAWN</button><button class="menuAction" id="deathSkinsBtn">✦　SHOP</button><button class="menuAction" id="deathMenuBtn">Ⅱ　BACK TO MENU</button><button id="skipBtn" aria-label="Skip level by watching an ad">▣　SKIP LEVEL</button></div></section></div>
<div id="levelCompleteOverlay" aria-hidden="true"><section class="menuPanel"><div class="deathMark">✓</div><p class="menuEyebrow">LEVEL CLEARED</p><h2 id="levelCompleteTitle">NICE WORK!</h2><p id="levelCompleteText" style="margin:-8px 0 20px;color:#a9c2c4;font-size:13px;font-weight:700;letter-spacing:.5px">YOU REACHED THE EXIT</p><div class="menuActions"><button class="menuAction primary" id="nextLevelBtn">▶　NEXT LEVEL</button></div></section></div>
<div id="settingsOverlay" aria-hidden="true"><section class="settingsPanel"><header class="settingsHead"><h2>SETTINGS</h2><button class="iconBtn" id="closeSettings" aria-label="Close settings">×</button></header><div class="settingsGrid"><div class="settingRow"><span class="settingName">SOUND</span><div class="settingControl"><button class="settingToggle" id="settingsMuteBtn" aria-pressed="false">ON</button></div></div><label class="settingRow" for="volumeControl"><span class="settingName">VOLUME</span><div class="settingControl"><input id="volumeControl" type="range" min="0" max="100" step="5" value="80"><output id="volumeValue">80%</output></div></label><div class="settingRow"><span class="settingName">CONTROLS</span><div class="settingControl"><div class="settingModes" id="controlModes"><button type="button" data-control-mode="auto">AUTO</button><button type="button" data-control-mode="touch">TOUCH</button><button type="button" data-control-mode="keyboard">KEYBOARD</button></div></div></div><label class="settingRow" for="controlSize"><span class="settingName">SIZE</span><div class="settingControl"><input id="controlSize" type="range" min="80" max="130" step="5" value="100"><output id="controlSizeValue">100%</output></div></label><label class="settingRow" for="controlOpacity"><span class="settingName">OPACITY</span><div class="settingControl"><input id="controlOpacity" type="range" min="25" max="90" step="1" value="58"><output id="controlOpacityValue">58%</output></div></label><div class="settingRow"><span class="settingName">JUMP SIDE</span><div class="settingControl"><button class="settingToggle" id="jumpSideBtn" aria-pressed="false">RIGHT</button></div></div></div><footer class="settingsFooter"><button class="menuAction" id="settingsDoneBtn">CLOSE</button><button class="menuAction danger" id="settingsMenuBtn">⌂　BACK TO MENU</button></footer></section></div>
<div id="overlay" aria-hidden="true"><section class="shop"><div class="shopHead"><h2>SKINS</h2><span id="shopCoins">● 0</span><button class="iconBtn" id="closeShop" aria-label="Close shop">×</button></div><div id="skinGrid"></div></section></div>
<div id="touchControls" aria-label="Touch controls">
  <div class="touchCluster" aria-label="Movement"><button class="touchBtn" data-control="left" aria-label="Move left" aria-pressed="false">‹</button><button class="touchBtn" data-control="right" aria-label="Move right" aria-pressed="false">›</button></div>
  <div class="touchCluster" aria-label="Jump"><button class="touchBtn jump" data-control="jump" aria-label="Jump" aria-pressed="false">▲</button></div>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const levelBadge = document.getElementById('levelBadge');
  const coinCount = document.getElementById('coinCount');
  const shopCoins = document.getElementById('shopCoins');
  const overlay = document.getElementById('overlay');
  const menuOverlay = document.getElementById('menuOverlay');
  const deathOverlay = document.getElementById('deathOverlay');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const touchControls = document.getElementById('touchControls');
  const menuSceneCanvas = document.getElementById('menuSceneCanvas');
  const menuSceneCtx = menuSceneCanvas.getContext('2d');
  const menuLevel = document.getElementById('menuLevel');
  const menuCoins = document.getElementById('menuCoins');
  const soundBtn = document.getElementById('soundBtn');
  const settingsMuteBtn = document.getElementById('settingsMuteBtn');
  const volumeControl = document.getElementById('volumeControl');
  const volumeValue = document.getElementById('volumeValue');
  const controlSize = document.getElementById('controlSize');
  const controlSizeValue = document.getElementById('controlSizeValue');
  const controlOpacity = document.getElementById('controlOpacity');
  const controlOpacityValue = document.getElementById('controlOpacityValue');
  const controlModes = document.getElementById('controlModes');
  const jumpSideBtn = document.getElementById('jumpSideBtn');
  const skipBtn = document.getElementById('skipBtn');
  const TAU = Math.PI * 2;
  const WORLD_H = 540;
  const COYOTE_TIME = 0.1;
  const JUMP_BUFFER_TIME = 0.1;
  const JUMP_SPEED = 585;
  const GRAVITY = 1550;
  const FALL_GRAVITY_MULTIPLIER = 1.25;
  const JUMP_CUT_MULTIPLIER = .68;
  const MAX_STEP_OFFSET = 78;
  const MAX_MOVING_PLATFORM_SWING = 12;
  const STORE_KEY = 'cat-ninja-poki-v1';
  const SKINS = [
    {name:'Ninja',cost:0,body:'#222b3b',accent:'#68e0db',eye:'#f7f5ec',style:'ninja'},
    {name:'Neon Ninja',cost:3,body:'#14202b',accent:'#8bff69',eye:'#fffbd1',style:'neon'},
    {name:'Ghost',cost:5,body:'#d7f4f2',accent:'#91c8d0',eye:'#263b54',style:'ghost'},
    {name:'Golden King',cost:8,body:'#e5a92f',accent:'#fff0a4',eye:'#30263a',style:'king'},
    {name:'Cyborg',cost:10,body:'#8b9ba8',accent:'#ff756b',eye:'#10232c',style:'cyborg'},
    {name:'Fire',cost:12,body:'#e65c39',accent:'#ffd15c',eye:'#fff4d2',style:'fire'},
    {name:'Pirate',cost:15,body:'#34384d',accent:'#e9be70',eye:'#f9e9c7',style:'pirate'}
  ];
  let save = {unlocked:1,coins:0,owned:[0],selected:0,claimed:[],settings:{soundMuted:false,soundVolume:.8,controlMode:'auto',controlScale:1,controlOpacity:.58,jumpLeft:false}};
  try {
    const stored = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (stored && typeof stored === 'object') save = {
      unlocked:Math.max(1,Math.min(50,Number(stored.unlocked)||1)),
      coins:Math.max(0,Number(stored.coins)||0),
      owned:Array.isArray(stored.owned)?stored.owned.filter(n=>Number.isInteger(n)&&n>=0&&n<SKINS.length):[0],
      selected:Number.isInteger(stored.selected)?stored.selected:0,
      claimed:Array.isArray(stored.claimed)?stored.claimed.filter(n=>Number.isInteger(n)&&n>=1&&n<=50):[],
      settings:stored.settings&&typeof stored.settings==='object'?{
        soundMuted:Boolean(stored.settings.soundMuted),
        soundVolume:Math.max(0,Math.min(1,Number.isFinite(Number(stored.settings.soundVolume))?Number(stored.settings.soundVolume):.8)),
        controlMode:['auto','touch','keyboard'].includes(stored.settings.controlMode)?stored.settings.controlMode:'auto',
        controlScale:Math.max(.8,Math.min(1.3,Number(stored.settings.controlScale)||1)),
        controlOpacity:Math.max(.25,Math.min(.9,Number(stored.settings.controlOpacity)||.58)),
        jumpLeft:Boolean(stored.settings.jumpLeft)
      }:{soundMuted:false,soundVolume:.8,controlMode:'auto',controlScale:1,controlOpacity:.58,jumpLeft:false}
    };
  } catch (e) {}
  if (!Array.isArray(save.owned)) save.owned=[0];
  if (!save.owned.includes(0)) save.owned.unshift(0);
  save.selected=save.owned.includes(save.selected)?save.selected:0;
  save.unlocked=Math.max(1,Math.min(50,Math.floor(Number(save.unlocked)||1)));
  save.coins=Math.max(0,Math.floor(Number(save.coins)||0));

  // Persist progress and settings without interrupting gameplay if storage is unavailable.
  function persist(){
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(save));
    } catch (e) {
      // The game should keep running even in private mode or when storage is full/blocked.
    }
  }

  let level = Math.min(save.unlocked,50);
  let current = null;
  let player = null;
  let cameraX = 0;
  let viewScale = 1;
  let viewW = 960;
  let dpr = 1;
  let lastTime = 0;
  let paused = false;
  let finished = false;
  let shopOpen = false;
  let settingsOpen = false;
  let settingsReturn = 'game';
  let deathScreenOpen = false;
  let levelCompleteOpen = false;
  let shopReturn = 'game';
  let isGameplayActive = false;
  let loadingFinished = false;
  let sdkBooted = false;
  let pendingGameplayEvents = [];
  let soundMuted = save.settings.soundMuted;
  let soundVolume = save.settings.soundVolume;
  let adMuted = false;
  let hidden = document.hidden;
  let audioContext = null;
  let deathCount = 0;
  let deathLock = false;
  let restartAt = 0;
  let hitstopUntil = 0;
  let shake = 0;
  let introHints = true;
  let frameNow = 0;
  let particles = [];
  const keys = {left:false,right:false,jump:false};
  const touchCapable = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const lowPowerDevice=(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=4;
  function applyControlSettings(){
    const mode=save.settings.controlMode;
    touchControls.style.display=mode==='touch'||(mode==='auto'&&touchCapable)?'flex':'none';
    touchControls.classList.toggle('jump-left',save.settings.jumpLeft);

  function buildLevel(n){
    // Curva de 50 niveles diseñada para ser justa: se introducen obstáculos
    // de uno en uno y se mantienen espacios de aterrizaje amplios.
    n=Math.max(1,Math.min(50,Math.floor(Number(n)||1)));
    const width=1180+(n-1)*19;
    const floorY=460;
    const obstacleBudget=n<=2?0:n<=8?1:n<=20?2:n<=35?3:4;
    const restLevel=n%5===0;
    const finalObstacleCount=restLevel?Math.max(0,obstacleBudget-1):obstacleBudget;
    // Los primeros retos enseñan un solo tipo. Después se combinan, pero
    // nunca se amontonan; el máximo es dos huecos y dos grupos de pinchos.
    const finalGapCount=finalObstacleCount===1?(n>=6?1:0):Math.floor(finalObstacleCount/2);
    const finalSpikeCount=finalObstacleCount-finalGapCount;
    const featureList=[];
    for(let i=0;i<finalGapCount;i++)featureList.push({type:'gap',order:i});
    for(let i=0;i<finalSpikeCount;i++)featureList.push({type:'spike',order:i});
    featureList.sort((a,b)=>((a.order*2+(a.type==='spike'?1:0))-(b.order*2+(b.type==='spike'?1:0))));
    const startX=300,endX=width-260,usable=endX-startX;
    const gaps=[],spikes=[],steps=[];
    const gapWidth=Math.min(82,68+Math.floor(n/15)*3);
    const spikeWidth=56;
    const spacing=featureList.length?usable/(featureList.length+1):0;
    featureList.forEach((feature,index)=>{
      const center=Math.round(startX+spacing*(index+1));
      if(feature.type==='gap'){
        const a=Math.round(center-gapWidth/2),b=a+gapWidth;
        gaps.push([a,b]);
      }else{
        const x=Math.round(center-spikeWidth/2);
        spikes.push([x,false]);
      }
    });
    // Construir el suelo y validar cada obstáculo contra sus segmentos.
    const segments=[];let segmentStart=28;
    gaps.forEach(([a,b])=>{if(a>segmentStart)segments.push([segmentStart,a]);segmentStart=b;});
    if(width-28>segmentStart)segments.push([segmentStart,width-28]);
    const safeSpikes=[];
    for(const [x] of spikes){
      const seg=segments.find(([a,b])=>x>=a+38&&x+spikeWidth<=b-38);
      if(seg)safeSpikes.push([x,false]);
    }
    // Monedas sobre el tramo sólido más largo: siempre accesibles con salto.
    const coinSegment=segments.reduce((best,seg)=>seg[1]-seg[0]>(best[1]-best[0])?seg:best,segments[0]||[300,width-200]);
    const coinX=Math.round((coinSegment[0]+coinSegment[1])/2);
    const platforms=[];
    segments.forEach(([a,b])=>platforms.push({x:a,y:floorY,w:b-a,h:24,kind:'solid',triggered:false}));
    const levelSpikes=safeSpikes.map(([x,isHidden])=>({x,y:floorY-20,w:spikeWidth,h:24,hidden:false,active:true,progress:1,warningAt:0}));
    return {n,gravity:1,floorY,platforms,spikes:levelSpikes,hiddenSpikes:false,exitX:width-62,coin:{x:coinX,y:floorY-82,taken:save.claimed.includes(n)},width,doorPulse:0};
  }

  function update(dt){

      }
    });
    const doorX=current.exitX;
    ctx.fillStyle='#ffcf66';ctx.shadowColor='#ffcf66';ctx.shadowBlur=14+Math.sin(frameNow*.006)*5;roundedRect(ctx,doorX-17,current.gravity===1?current.floorY-74:current.floorY+24,36,72,16);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#37404b';roundedRect(ctx,doorX-10,current.gravity===1?current.floorY-65:current.floorY+32,22,63,12);ctx.fill();ctx.fillStyle='#ffcf66';ctx.beginPath();ctx.arc(doorX+5,current.gravity===1?current.floorY-37:current.floorY+61,2.4,0,TAU);ctx.fill();
    if(!current.coin.taken){const cy=current.coin.y+Math.sin(frameNow*.006)*5;ctx.fillStyle='#ffcf66';ctx.shadowColor='#ffcf66';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(current.coin.x,cy,10,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff0a3';ctx.lineWidth=3;ctx.beginPath();ctx.arc(current.coin.x,cy,5,0,TAU);ctx.stroke();}
    particles.forEach(p=>{const fade=Math.max(0,p.life/p.max);ctx.globalAlpha=fade;ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation||0);ctx.beginPath();ctx.arc(0,0,p.size*(.45+.55*fade),0,TAU);ctx.fill();ctx.restore();});ctx.globalAlpha=1;
    if(!deathLock||frameNow>hitstopUntil){
      const lean=Math.max(-.08,Math.min(.08,player.vx*.00022))-Math.max(-.1,Math.min(.1,player.vy*.00012));
      drawCat(ctx,player.x+player.w/2,player.y+player.h/2+Math.sin(player.runPhase*2)*Math.min(2,Math.abs(player.vx)*.006),lean,SKINS[save.selected],player.scaleX,player.scaleY,player.blink);
      if(player.invuln>0&&Math.floor(frameNow/65)%2===0){ctx.strokeStyle='#ffffffa0';ctx.lineWidth=2;ctx.strokeRect(player.x-4,player.y-4,player.w+8,player.h+8);}
    }
    if(introHints&&level===1){
      const hintY=380;ctx.globalAlpha=.8;
      drawArrow(ctx,150,hintY,'left');drawArrow(ctx,206,hintY,'right');drawArrow(ctx,750,hintY,'up');ctx.globalAlpha=1;
      ctx.save();ctx.font='800 14px system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle='#f7f5ec';ctx.shadowColor='#10151e';ctx.shadowBlur=8;ctx.fillText('MOVE  •  JUMP  •  REACH THE DOOR',cameraX+viewW/2,92);ctx.restore();
    }
    ctx.restore();
    if(finished){
      ctx.fillStyle='#071018b8';ctx.fillRect(0,0,w,h);
      const cx=w/2,cy=h/2;
      ctx.strokeStyle='#ffcf66';ctx.lineWidth=5;ctx.beginPath();ctx.arc(cx,cy,62,0,TAU);ctx.stroke();
      ctx.fillStyle='#ffcf66';ctx.beginPath();
      for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?25:49;const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
      ctx.closePath();ctx.fill();drawCat(ctx,cx,cy+96,0,SKINS[save.selected],1,1,0);
    }
  }
  function drawArrow(c,x,y,direction){
    c.save();c.translate(x,y);if(direction==='left')c.rotate(Math.PI);if(direction==='up')c.rotate(-Math.PI/2);
    c.strokeStyle='#f5fbf4';c.lineWidth=5;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(-13,0);c.lineTo(13,0);c.lineTo(5,-9);c.moveTo(13,0);c.lineTo(5,9);c.stroke();c.restore();
  }
  function loop(now){
    const dt=Math.min(.033,(now-lastTime)/1000||0);lastTime=now;update(dt);draw();requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  let sdkInitStarted=false;
  function finishLoading(){
    if(loadingFinished||!sdkReady()||!sdkBooted)return;loadingFinished=true;safeSdkCall('gameLoadingFinished');
  }
  function markSdkBooted(){
    if(sdkBooted)return;
    sdkBooted=true;finishLoading();
    const queuedEvents=pendingGameplayEvents;pendingGameplayEvents=[];
    queuedEvents.forEach(active=>safeSdkCall(active?'gameplayStart':'gameplayStop'));
  }
  function initializeSdk(){
    if(sdkInitStarted)return;
    const sdk=sdkReady();
    if(!sdk){finishLoading();return;}
    sdkInitStarted=true;
    try {
      if(typeof sdk.init==='function')Promise.resolve(sdk.init()).then(markSdkBooted,()=>{pendingGameplayEvents=[];finishLoading();});
      else markSdkBooted();
    }
    catch(e){finishLoading();}
  }
  try {
    if(sdkReady())initializeSdk();
    else {
      const sdkScript=document.querySelector('script[src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"]');
      if(sdkScript){sdkScript.addEventListener('load',initializeSdk,{once:true});sdkScript.addEventListener('error',finishLoading,{once:true});}
      window.setTimeout(()=>{if(!sdkInitStarted&&sdkReady())initializeSdk();},4000);
    }
  } catch(e) {finishLoading();}
})();
</script>
